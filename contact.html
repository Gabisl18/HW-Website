<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surf Culture | Contact</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="brand"><span class="wave-emoji">🌊</span>Surf Culture</a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="history.html">History</a></li>
          <li><a href="gear.html">Gear Guide</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Contact</h1>
    <p>Questions about surfing or this site? Send a message below.</p>
  </section>

  <main class="container">
    <section>
      <form class="contact-form" id="contact-form" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" />
        <span class="error-text" id="name-error"></span>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <span class="error-text" id="email-error"></span>

        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>
        <span class="error-text" id="message-error"></span>

        <button class="btn" type="submit" style="margin-top: 1rem;">Send Message</button>

        <div class="form-status" id="form-status"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Surf Culture. Built for a class assignment with HTML, CSS &amp; JavaScript.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
